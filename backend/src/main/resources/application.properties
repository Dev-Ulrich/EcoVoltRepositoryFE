spring.application.name=ecovolt-api
server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Oracle Free/shared database: reserve at most one session per API instance.
# Other clients, previous Render instances and Oracle's session limit still matter.
spring.datasource.hikari.pool-name=EcoVoltOraclePool
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.initialization-fail-timeout=-1

spring.sql.init.mode=never
server.error.include-message=never
server.error.include-stacktrace=never

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
